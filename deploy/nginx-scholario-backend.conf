# Copy this file to /etc/nginx/sites-available/scholario-backend on your VM,
# replace yourdomain.com with your real domain, then:
#   sudo ln -s /etc/nginx/sites-available/scholario-backend /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# After that, run certbot (see README.md) to get HTTPS — it will edit this
# file automatically to add the SSL block.

server {
    listen 80;
    server_name yourdomain.com;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
